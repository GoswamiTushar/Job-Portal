<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#b5179e" />
    </linearGradient>
    <linearGradient id="peakGrad" x1="20%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="60%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#f72585" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00f2fe" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Rounded container with dark backdrop -->
  <rect width="100" height="100" rx="24" fill="#0b0f19" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Stylized Ascending R + Crest Peak -->
  <g filter="url(#glow)">
    <!-- Mountain Crest Peak (The Summit) -->
    <path 
      d="M50 16 L65 36 L56 36 L68 50 L32 50 L44 36 L35 36 Z" 
      fill="url(#peakGrad)" 
      opacity="0.95"
    />
    <!-- R Stem & Ascending Leg -->
    <path 
      d="M28 78 L42 46 M38 52 L68 52 C76 52, 78 60, 72 65 C68 68, 62 68, 54 68 M52 66 L72 82" 
      fill="none" 
      stroke="url(#crestGrad)" 
      stroke-width="8" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
  </g>
</svg>
